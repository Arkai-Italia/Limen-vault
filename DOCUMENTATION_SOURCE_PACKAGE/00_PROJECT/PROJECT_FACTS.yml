public_url: "NOT_APPLICABLE"
authenticated_url: "NOT_APPLICABLE"
target_audiences:
  - "Professionisti della consulenza, legali, direttori d'azienda"
  - "Knowledge manager aziendali"
  - "Team di ricerca con vincoli di riservatezza e confidenzialità assoluta"
locales:
  - "it-IT (Predefinito)"
  - "en-US (Localizzazione nativa con commutatore istantaneo IT | EN)"
platforms:
  - "macOS Desktop (Bundle signed Developer ID, Notarized, DMG)"
  - "Windows Desktop (Installer NSIS)"
roles:
  - id: "vault-operator"
    name: "Operatore del Vault / Utente Locale"
    scope: "Pieno accesso ai file del Vault locale, alla memoria semantica, agli snapshot e alle configurazioni di rete zero"
plans:
  - id: "local-first"
    name: "Modalità 100% Solo Locale (Rete Zero)"
    cost: "Gratuita / Open-source"
    network: "Nessun pacchetto dati esce dal computer; calcolo semantico e inferenza generativa completamente on-device"
  - id: "hybrid-openai"
    name: "Modalità Ibrida OpenAI"
    cost: "Consumo API OpenAI a carico dell'utente tramite propria chiave"
    network: "Trasmissione esclusiva dei passaggi rilevanti estratti localmente, previa autorizzazione esplicita"
feature_flags: []
visual_audit_authorized: true
non_destructive_testing_authorized: true
demo_account_source: "FIXTURE (Cartella 'vault-template/')"
design_system_source: "apps/desktop/src/ (Dark Slate #0f172a, Lime Accent #c8ff00, Success #77f117, Text #f8fafc)"
output_language: "it-IT"
output_directory: "DOCUMENTATION_SOURCE_PACKAGE"
requested_scope: "ALL_USER_VISIBLE_FUNCTIONALITY"
